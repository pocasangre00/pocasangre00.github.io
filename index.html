<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Netflix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin: 20px 0;
    }

    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .pelicula {
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .pelicula:hover {
      transform: scale(1.05);
    }

    .pelicula img {
      width: 100%;
      border-radius: 5px;
    }

    .pelicula .titulo {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      padding: 5px;
      font-size: 14px;
      text-align: center;
    }
